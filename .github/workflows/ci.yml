name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t policyaction:ci .

      - name: Build sidecar image
        run: docker build -t policyaction-sidecar:ci ./sidecar

  eval:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: check

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: policyaction
          POSTGRES_PASSWORD: policyaction
          POSTGRES_DB: policyaction
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U policyaction"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://policyaction:policyaction@localhost:5432/policyaction
        run: npm run db:migrate

      - name: Start server
        env:
          DATABASE_URL: postgresql://policyaction:policyaction@localhost:5432/policyaction
          MODEL_PROVIDER: ${{ secrets.MODEL_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PORT: "3000"
        run: |
          npm run dev &
          sleep 5

      - name: Run eval with CI gates
        env:
          MODEL_PROVIDER: ${{ secrets.MODEL_PROVIDER }}
          PORT: "3000"
        run: npm run eval:ci
