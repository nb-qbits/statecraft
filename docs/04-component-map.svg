<svg width="620" height="1090" viewBox="0 0 620 1090" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>PolicyAction component map: build versus reuse</title>
<desc>Thirteen pipeline components plus three supporting systems, each tagged as built in-house, reused from open source, or adapted behind an interface.</desc>

<style>
  .th { font-size: 13.5px; font-weight: 500; fill: #1a1a18; }
  .ts { font-size: 10.5px; fill: #6b6a65; }
  .tag { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; }
  .build rect { fill: #e8f2f0; stroke: #4a8f83; }
  .build .tag { fill: #2f6b60; }
  .reuse rect { fill: #f0efec; stroke: #a8a59c; }
  .reuse .tag { fill: #6b6a65; }
  .adapt rect { fill: #efeaf4; stroke: #8f7aa8; }
  .adapt .tag { fill: #6b5482; }
  .arr { stroke: #a8a59c; stroke-width: 1.25; }
  .sec { font-size: 11px; font-weight: 600; fill: #6b6a65; letter-spacing: 0.04em; }
</style>

<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#a8a59c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="620" height="1090" fill="#ffffff"/>

<g class="reuse"><rect x="30" y="46" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="66" dominant-baseline="central">Legislative metadata</text><text class="tag" x="568" y="66" text-anchor="end" dominant-baseline="central">REUSE</text><text class="ts" x="52" y="84" dominant-baseline="central">Open States or LegiScan, status and versions</text></g>
<line x1="310" y1="98" x2="310" y2="112" class="arr" marker-end="url(#ar)"/>

<g class="build"><rect x="30" y="114" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="134" dominant-baseline="central">Ingest and identity</text><text class="tag" x="568" y="134" text-anchor="end" dominant-baseline="central">BUILD</text><text class="ts" x="52" y="152" dominant-baseline="central">MinIO or S3, SHA-256 immutable versions</text></g>
<line x1="310" y1="166" x2="310" y2="180" class="arr" marker-end="url(#ar)"/>

<g class="adapt"><rect x="30" y="182" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="202" dominant-baseline="central">Parse to segments</text><text class="tag" x="568" y="202" text-anchor="end" dominant-baseline="central">ADAPT</text><text class="ts" x="52" y="220" dominant-baseline="central">Docling sidecar, plus DOCX run properties</text></g>
<line x1="310" y1="234" x2="310" y2="248" class="arr" marker-end="url(#ar)"/>

<g class="build"><rect x="30" y="250" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="270" dominant-baseline="central">Normalize and offset map</text><text class="tag" x="568" y="270" text-anchor="end" dominant-baseline="central">BUILD</text><text class="ts" x="52" y="288" dominant-baseline="central">Reversible normalized to original mapping</text></g>
<line x1="310" y1="302" x2="310" y2="316" class="arr" marker-end="url(#ar)"/>

<g class="build"><rect x="30" y="318" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="338" dominant-baseline="central">Candidate scan</text><text class="tag" x="568" y="338" text-anchor="end" dominant-baseline="central">BUILD</text><text class="ts" x="52" y="356" dominant-baseline="central">Modal verbs, citations, history suppression</text></g>
<line x1="310" y1="370" x2="310" y2="384" class="arr" marker-end="url(#ar)"/>

<g class="reuse"><rect x="30" y="386" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="406" dominant-baseline="central">Model gateway</text><text class="tag" x="568" y="406" text-anchor="end" dominant-baseline="central">REUSE</text><text class="ts" x="52" y="424" dominant-baseline="central">LiteLLM or OpenRouter, fixture replay</text></g>
<line x1="310" y1="438" x2="310" y2="452" class="arr" marker-end="url(#ar)"/>

<g class="build"><rect x="30" y="454" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="474" dominant-baseline="central">Span proposal</text><text class="tag" x="568" y="474" text-anchor="end" dominant-baseline="central">BUILD</text><text class="ts" x="52" y="492" dominant-baseline="central">Constrained schema with no value fields</text></g>
<line x1="310" y1="506" x2="310" y2="520" class="arr" marker-end="url(#ar)"/>

<g class="build"><rect x="30" y="522" width="560" height="52" rx="8" stroke-width="2"/><text class="th" x="52" y="542" dominant-baseline="central">Anchor and verify</text><text class="tag" x="568" y="542" text-anchor="end" dominant-baseline="central">BUILD</text><text class="ts" x="52" y="560" dominant-baseline="central">Pure TypeScript, bounded fuzzy, fails closed</text></g>
<line x1="310" y1="574" x2="310" y2="588" class="arr" marker-end="url(#ar)"/>

<g class="build"><rect x="30" y="590" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="610" dominant-baseline="central">Legal date grammar</text><text class="tag" x="568" y="610" text-anchor="end" dominant-baseline="central">BUILD</text><text class="ts" x="52" y="628" dominant-baseline="central">Chevrotain, parse-or-fail, never guesses</text></g>
<line x1="310" y1="642" x2="310" y2="656" class="arr" marker-end="url(#ar)"/>

<g class="build"><rect x="30" y="658" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="678" dominant-baseline="central">Jurisdiction pack</text><text class="tag" x="568" y="678" text-anchor="end" dominant-baseline="central">BUILD</text><text class="ts" x="52" y="696" dominant-baseline="central">Virginia rules, calendar seeded then frozen</text></g>
<line x1="310" y1="710" x2="310" y2="724" class="arr" marker-end="url(#ar)"/>

<g class="build"><rect x="30" y="726" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="746" dominant-baseline="central">Resolver and support check</text><text class="tag" x="568" y="746" text-anchor="end" dominant-baseline="central">BUILD</text><text class="ts" x="52" y="764" dominant-baseline="central">Pure function, emits statutory citations</text></g>
<line x1="310" y1="778" x2="310" y2="792" class="arr" marker-end="url(#ar)"/>

<g class="build"><rect x="30" y="794" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="814" dominant-baseline="central">Lane router and coverage</text><text class="tag" x="568" y="814" text-anchor="end" dominant-baseline="central">BUILD</text><text class="ts" x="52" y="832" dominant-baseline="central">Deterministic policy with stored reasons</text></g>
<line x1="310" y1="846" x2="310" y2="860" class="arr" marker-end="url(#ar)"/>

<g class="build"><rect x="30" y="862" width="560" height="52" rx="8" stroke-width="1"/><text class="th" x="52" y="882" dominant-baseline="central">Review and register</text><text class="tag" x="568" y="882" text-anchor="end" dominant-baseline="central">BUILD</text><text class="ts" x="52" y="900" dominant-baseline="central">Next.js workspace, provenance sheet</text></g>

<text class="sec" x="30" y="948" dominant-baseline="central">SUPPORTING SYSTEMS, OUTSIDE THE PIPELINE</text>

<g class="reuse"><rect x="30" y="962" width="176" height="52" rx="8" stroke-width="1"/><text class="th" x="48" y="982" dominant-baseline="central">Annotation</text><text class="ts" x="48" y="1000" dominant-baseline="central">Label Studio</text></g>
<g class="build"><rect x="222" y="962" width="176" height="52" rx="8" stroke-width="1"/><text class="th" x="240" y="982" dominant-baseline="central">Scorer</text><text class="ts" x="240" y="1000" dominant-baseline="central">Match function</text></g>
<g class="reuse"><rect x="414" y="962" width="176" height="52" rx="8" stroke-width="1"/><text class="th" x="432" y="982" dominant-baseline="central">Platform</text><text class="ts" x="432" y="1000" dominant-baseline="central">Queue, logs, config</text></g>

<g class="build"><rect x="30" y="1050" width="10" height="10" rx="2" stroke-width="1"/></g>
<text class="ts" x="46" y="1056" dominant-baseline="central">Build — ours, the moat</text>
<g class="reuse"><rect x="230" y="1050" width="10" height="10" rx="2" stroke-width="1"/></g>
<text class="ts" x="246" y="1056" dominant-baseline="central">Reuse — open source</text>
<g class="adapt"><rect x="430" y="1050" width="10" height="10" rx="2" stroke-width="1"/></g>
<text class="ts" x="446" y="1056" dominant-baseline="central">Adapt — probe first</text>
</svg>
